      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -p 5000:5000 \
            student-result-ml:${{ github.sha }}

      - name: Show container status & logs (debug)
        run: |
          sleep 5
          echo "=== docker ps -a ==="
          docker ps -a
          echo "=== docker logs ==="
          docker logs student-result-ml-container || true
          echo "=== docker inspect ==="
          docker inspect student-result-ml-container --format='{{.State.Status}} {{.State.ExitCode}} {{.State.Error}}' || true

      - name: Wait for application to become ready
        run: |
          for i in {1..20}; do
            if curl --fail --silent --max-time 3 http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 3
          done
          echo "=== FINAL LOGS ==="
          docker logs student-result-ml-container
          exit 1
